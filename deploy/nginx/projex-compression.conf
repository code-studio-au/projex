# Managed application compression policy.
# This file is loaded at nginx's http context from /etc/nginx/conf.d/*.conf.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;

# text/html is compressed by nginx automatically when gzip is enabled.
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/ld+json
  application/manifest+json
  application/rss+xml
  application/xml
  application/xhtml+xml
  image/svg+xml;
