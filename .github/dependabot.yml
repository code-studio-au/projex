version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      framework:
        patterns:
          - '@tanstack/*'
          - '@vitejs/plugin-react'
          - vite
          - srvx
          - h3-v2
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      aws-cdk:
        patterns:
          - aws-cdk
          - aws-cdk-lib
      mantine:
        patterns:
          - '@mantine/*'
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
