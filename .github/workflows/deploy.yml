name: Deploy

on:
  workflow_dispatch:
    inputs:
      release_selection:
        description: Use the latest verified release or provide a specific Release run ID
        required: true
        default: latest-successful
        type: choice
        options:
          - latest-successful
          - specific-run-id
      release_run_id:
        description: Required for production, rollback, or specific-run-id selection
        required: false
        type: string
      deployment_mode:
        description: Promote a release or roll back to the retained N-1 release
        required: true
        default: promote
        type: choice
        options:
          - promote
          - rollback
      deployment_context:
        description: Optional context appended to the derived PR or SHA deployment reason
        required: false
        type: string
      environment_name:
        description: Protected deployment environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      aws_region:
        description: AWS region for artifact handoff and SSM deploy
        required: true
        default: ap-southeast-2
        type: string

concurrency:
  group: deploy-${{ inputs.environment_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-ec2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment_name }}
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
    env:
      DEPLOY_AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      DEPLOY_EC2_APP_ROOT: ${{ secrets.EC2_APP_ROOT }}
      DEPLOY_EC2_DEPLOY_ARTIFACT_BUCKET: ${{ secrets.EC2_DEPLOY_ARTIFACT_BUCKET }}
      DEPLOY_EC2_ENV_FILE: ${{ secrets.EC2_ENV_FILE }}
      DEPLOY_EC2_HEALTH_URL: ${{ secrets.EC2_HEALTH_URL }}
      DEPLOY_EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      DEPLOY_EC2_KEEP_RELEASES: ${{ secrets.EC2_KEEP_RELEASES }}
      DEPLOY_EC2_PUBLIC_BASE_URL: ${{ secrets.EC2_PUBLIC_BASE_URL }}
      DEPLOY_EC2_READY_URL: ${{ secrets.EC2_READY_URL }}
      DEPLOY_EC2_SERVICE_NAME: ${{ secrets.EC2_SERVICE_NAME }}

    steps:
      - name: Validate protected deployment request
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment_name }}
          DEPLOY_MODE: ${{ inputs.deployment_mode }}
          DEPLOY_WORKFLOW_REF: ${{ github.ref }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_SELECTION: ${{ inputs.release_selection }}
        run: |
          if [[ "$DEPLOY_WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "EC2 deployments must be dispatched from main." >&2
            exit 1
          fi
          if [[ "$RELEASE_SELECTION" == "specific-run-id" ]]; then
            if [[ ! "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "Specific release selection requires a positive Release run ID." >&2
              exit 1
            fi
          elif [[ -n "${RELEASE_RUN_ID//[[:space:]]/}" ]]; then
            echo "Leave release_run_id empty when selecting latest-successful." >&2
            exit 1
          fi
          if [[ "$DEPLOY_ENVIRONMENT" == "production" &&
            "$RELEASE_SELECTION" != "specific-run-id" ]]; then
            echo "Production promotion requires the specific Release run tested in staging." >&2
            exit 1
          fi
          if [[ "$DEPLOY_MODE" == "rollback" &&
            "$RELEASE_SELECTION" != "specific-run-id" ]]; then
            echo "Rollback requires the specific retained N-1 Release run ID." >&2
            exit 1
          fi

      - name: Checkout protected deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Resolve and validate selected Release workflow run
        id: selected-release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_SELECTION: ${{ inputs.release_selection }}
        run: |
          RELEASE_RUN_ID="$INPUT_RELEASE_RUN_ID"
          if [[ "$RELEASE_SELECTION" == "latest-successful" ]]; then
            RELEASE_RUN_ID="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?branch=main&status=success&per_page=20" \
                --jq '[
                  .workflow_runs[]
                  | select(
                      .path == ".github/workflows/release.yml" and
                      .event == "workflow_run"
                    )
                ][0].id // empty'
            )"
          fi
          if [[ ! "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "No eligible successful Release workflow run was found." >&2
            exit 1
          fi

          RUN_DETAILS="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}" \
              --jq '[.id, .path, .conclusion, .head_branch, .event] | @tsv'
          )"
          IFS=$'\t' read -r RUN_ID RUN_PATH RUN_CONCLUSION RUN_BRANCH RUN_EVENT <<<"$RUN_DETAILS"
          if [[ "$RUN_ID" != "$RELEASE_RUN_ID" ||
            "$RUN_PATH" != ".github/workflows/release.yml" ||
            "$RUN_CONCLUSION" != "success" ||
            "$RUN_BRANCH" != "main" ||
            ( "$RUN_EVENT" != "workflow_run" && "$RUN_EVENT" != "workflow_dispatch" ) ]]; then
            echo "Selected run must be a successful Release workflow run on main." >&2
            exit 1
          fi
          echo "run_id=${RELEASE_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Download retained release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          merge-multiple: true
          path: artifacts
          pattern: projex-release-*
          run-id: ${{ steps.selected-release.outputs.run_id }}

      - name: Validate retained release bundle
        id: release
        run: node scripts/verify-release-bundle.mjs artifacts

      - name: Resolve auditable deployment reason
        id: deployment
        env:
          DEPLOYMENT_CONTEXT: ${{ inputs.deployment_context }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment_name }}
          DEPLOY_MODE: ${{ inputs.deployment_mode }}
          EXPECTED_GIT_SHA: ${{ steps.release.outputs.git_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          DEPLOY_COMMIT_SUBJECT="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_GIT_SHA}" \
              --jq '.commit.message | split("\n")[0]'
          )"
          export DEPLOY_COMMIT_SUBJECT
          node scripts/deploy-request-metadata.mjs

      - name: Summarize resolved deployment request
        env:
          DEPLOYMENT_REASON: ${{ steps.deployment.outputs.deployment_reason }}
          EXPECTED_GIT_SHA: ${{ steps.release.outputs.git_sha }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_RUN_ID: ${{ steps.selected-release.outputs.run_id }}
        run: |
          {
            echo "### Resolved deployment request"
            echo
            echo "- Release run: \`${RELEASE_RUN_ID}\`"
            echo "- Release: \`${RELEASE_ID}\`"
            echo "- Source: \`${EXPECTED_GIT_SHA}\`"
            echo "- Reason: ${DEPLOYMENT_REASON}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify signed release provenance and SBOM
        env:
          ARTIFACT_PATH: ${{ steps.release.outputs.artifact_path }}
          GH_TOKEN: ${{ github.token }}
          SBOM_PATH: ${{ steps.release.outputs.sbom_path }}
        run: |
          SIGNER_WORKFLOW="${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          gh attestation verify "$ARTIFACT_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW"
          gh attestation verify "$ARTIFACT_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --format json \
            --jq '.[0].verificationResult.statement.predicate' \
            >artifacts/attested-sbom.spdx.json
          node -e '
            const assert = require("node:assert/strict");
            const fs = require("node:fs");
            assert.deepEqual(
              JSON.parse(fs.readFileSync(process.argv[1], "utf8")),
              JSON.parse(fs.readFileSync(process.argv[2], "utf8"))
            );
          ' "$SBOM_PATH" artifacts/attested-sbom.spdx.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 26

      - name: Validate OIDC deployment role
        run: |
          if [[ -z "$DEPLOY_AWS_DEPLOY_ROLE_ARN" ]]; then
            echo "AWS_DEPLOY_ROLE_ARN must be configured as a GitHub environment variable." >&2
            exit 1
          fi

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ env.DEPLOY_AWS_DEPLOY_ROLE_ARN }}
          role-session-name: projex-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload verified artifact to deploy bucket
        id: upload-artifact-s3
        env:
          ARTIFACT_NAME: ${{ steps.release.outputs.artifact_name }}
          ARTIFACT_PATH: ${{ steps.release.outputs.artifact_path }}
          AWS_REGION_DEPLOY: ${{ inputs.aws_region }}
          DEPLOY_ARTIFACT_BUCKET: ${{ env.DEPLOY_EC2_DEPLOY_ARTIFACT_BUCKET }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment_name }}
          EXPECTED_ARTIFACT_SHA256: ${{ steps.release.outputs.artifact_sha256 }}
          EXPECTED_GIT_SHA: ${{ steps.release.outputs.git_sha }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          test -n "$DEPLOY_ARTIFACT_BUCKET"
          read -r ACTUAL_ARTIFACT_SHA256 _ < <(sha256sum "$ARTIFACT_PATH")
          if [[ "$ACTUAL_ARTIFACT_SHA256" != "$EXPECTED_ARTIFACT_SHA256" ]]; then
            echo "Downloaded release artifact checksum changed after validation." >&2
            exit 1
          fi
          S3_KEY="deploy-artifacts/${DEPLOY_ENVIRONMENT}/${EXPECTED_GIT_SHA}/${RELEASE_ID}/${ARTIFACT_NAME}"
          aws s3 cp \
            --region "$AWS_REGION_DEPLOY" \
            "$ARTIFACT_PATH" \
            "s3://${DEPLOY_ARTIFACT_BUCKET}/${S3_KEY}"
          echo "artifact_s3_uri=s3://${DEPLOY_ARTIFACT_BUCKET}/${S3_KEY}" >> "$GITHUB_OUTPUT"

      - name: Dispatch deploy command over SSM
        id: dispatch-ssm
        env:
          ARTIFACT_AWS_REGION: ${{ inputs.aws_region }}
          ARTIFACT_SHA256: ${{ steps.release.outputs.artifact_sha256 }}
          ARTIFACT_S3_URI: ${{ steps.upload-artifact-s3.outputs.artifact_s3_uri }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment_name }}
          DEPLOY_MODE: ${{ inputs.deployment_mode }}
          EC2_APP_ROOT: ${{ env.DEPLOY_EC2_APP_ROOT }}
          EC2_ENV_FILE: ${{ env.DEPLOY_EC2_ENV_FILE }}
          EC2_HEALTH_URL: ${{ env.DEPLOY_EC2_HEALTH_URL }}
          EC2_INSTANCE_ID: ${{ env.DEPLOY_EC2_INSTANCE_ID }}
          EC2_READY_URL: ${{ env.DEPLOY_EC2_READY_URL }}
          EC2_SERVICE_NAME: ${{ env.DEPLOY_EC2_SERVICE_NAME }}
          EC2_KEEP_RELEASES: ${{ env.DEPLOY_EC2_KEEP_RELEASES }}
          EXPECTED_BUILD_MODE: ${{ steps.release.outputs.build_mode }}
          EXPECTED_BUILD_RUN_ATTEMPT: ${{ steps.release.outputs.build_run_attempt }}
          EXPECTED_BUILD_RUN_ID: ${{ steps.release.outputs.build_run_id }}
          EXPECTED_GIT_SHA: ${{ steps.release.outputs.git_sha }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          SSM_COMMENT: ${{ steps.deployment.outputs.ssm_comment }}
        run: |
          test -n "$EC2_INSTANCE_ID"
          test -n "$ARTIFACT_S3_URI"
          APP_ROOT="${EC2_APP_ROOT:-/opt/projex}"
          ENV_FILE="${EC2_ENV_FILE:-/etc/projex/projex.env}"
          SERVICE_NAME="${EC2_SERVICE_NAME:-projex}"
          HEALTH_URL="${EC2_HEALTH_URL:-http://127.0.0.1:3000/api/health}"
          READY_URL="${EC2_READY_URL:-http://127.0.0.1:3000/api/ready}"
          KEEP_RELEASES="${EC2_KEEP_RELEASES:-5}"
          SCRIPT_B64="$(base64 -w 0 scripts/deploy-artifact-ssm.sh)"
          export APP_ROOT ENV_FILE SERVICE_NAME HEALTH_URL READY_URL KEEP_RELEASES SCRIPT_B64
          python3 - <<'PY' > /tmp/projex-ssm-commands.json
          import json
          import os
          import shlex

          env_values = {
              "APP_ROOT": os.environ["APP_ROOT"],
              "RELEASE_ID": os.environ["RELEASE_ID"],
              "EXPECTED_GIT_SHA": os.environ["EXPECTED_GIT_SHA"],
              "EXPECTED_BUILD_MODE": os.environ["EXPECTED_BUILD_MODE"],
              "EXPECTED_BUILD_RUN_ID": os.environ["EXPECTED_BUILD_RUN_ID"],
              "EXPECTED_BUILD_RUN_ATTEMPT": os.environ["EXPECTED_BUILD_RUN_ATTEMPT"],
              "DEPLOY_ENVIRONMENT": os.environ["DEPLOY_ENVIRONMENT"],
              "DEPLOY_MODE": os.environ["DEPLOY_MODE"],
              "ENV_FILE": os.environ["ENV_FILE"],
              "SERVICE_NAME": os.environ["SERVICE_NAME"],
              "HEALTH_URL": os.environ["HEALTH_URL"],
              "READY_URL": os.environ["READY_URL"],
              "KEEP_RELEASES": os.environ["KEEP_RELEASES"],
              "ARTIFACT_S3_URI": os.environ["ARTIFACT_S3_URI"],
              "ARTIFACT_AWS_REGION": os.environ["ARTIFACT_AWS_REGION"],
              "ARTIFACT_SHA256": os.environ["ARTIFACT_SHA256"],
          }
          env_prefix = " ".join(
              f"{key}={shlex.quote(value)}" for key, value in env_values.items()
          )
          commands = [
              "set -euo pipefail",
              "cat <<'PROJEX_SSM_SCRIPT_B64' >/tmp/projex-deploy-artifact-ssm.sh.b64",
              os.environ["SCRIPT_B64"],
              "PROJEX_SSM_SCRIPT_B64",
              "base64 -d /tmp/projex-deploy-artifact-ssm.sh.b64 >/tmp/projex-deploy-artifact-ssm.sh",
              "chmod 0755 /tmp/projex-deploy-artifact-ssm.sh",
              f"{env_prefix} bash /tmp/projex-deploy-artifact-ssm.sh",
          ]
          print(json.dumps({"commands": commands}))
          PY
          COMMAND_ID="$(
            aws ssm send-command \
              --region "${{ inputs.aws_region }}" \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "$SSM_COMMENT" \
              --parameters file:///tmp/projex-ssm-commands.json \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM deploy completion
        env:
          AWS_REGION_DEPLOY: ${{ inputs.aws_region }}
          COMMAND_ID: ${{ steps.dispatch-ssm.outputs.command_id }}
          EC2_INSTANCE_ID: ${{ env.DEPLOY_EC2_INSTANCE_ID }}
        run: |
          test -n "$COMMAND_ID"
          test -n "$EC2_INSTANCE_ID"
          while true; do
            STATUS="$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION_DEPLOY" \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query 'Status' \
                --output text 2>/dev/null || true
            )"
            case "$STATUS" in
              ""|Pending|InProgress|Delayed)
                sleep 10
                ;;
              Success)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION_DEPLOY" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                break
                ;;
              *)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION_DEPLOY" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text || true
                aws ssm get-command-invocation \
                  --region "$AWS_REGION_DEPLOY" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text || true
                echo "SSM deploy failed with status: $STATUS" >&2
                exit 1
                ;;
            esac
          done

      - name: Verify deployed public surface
        env:
          PROJEX_VERIFY_BASE_URL: ${{ secrets.EC2_PUBLIC_BASE_URL }}
          PROJEX_VERIFY_AUTH_EMAIL: ${{ secrets.EC2_VERIFY_AUTH_EMAIL }}
          PROJEX_VERIFY_AUTH_PASSWORD: ${{ secrets.EC2_VERIFY_AUTH_PASSWORD }}
        run: |
          test -n "$PROJEX_VERIFY_BASE_URL"
          node scripts/verify-deploy-security.mjs
