name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and package
        required: true
        default: main
        type: string
      deploy_target:
        description: Build artifact only, or build and push to EC2
        required: true
        default: artifact-only
        type: choice
        options:
          - artifact-only
          - ec2
      environment_name:
        description: Environment label used for the release id
        required: true
        default: staging
        type: string

concurrency:
  group: deploy-${{ inputs.environment_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: projex_deploy_gate
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d projex_deploy_gate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/projex_deploy_gate
      BETTER_AUTH_SECRET: projex-deploy-better-auth-secret-0123456789
      BETTER_AUTH_URL: https://projex.test.invalid
      BETTER_AUTH_TRUSTED_ORIGINS: https://projex.test.invalid
      NODE_ENV: test
      PROJEX_ENABLE_DEV_ENDPOINTS: 'false'
      PROJEX_ENABLE_SMOKE_TOOLS: 'false'
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact_name }}
      release-id: ${{ steps.package.outputs.release_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run application verification gate
        run: pnpm run verify:app

      - name: Run database verification gate
        run: pnpm run verify:db:gate

      - name: Run smoke verification gate
        run: pnpm run verify:smoke:basics:skip-build

      - name: Run browser smoke verification gate
        run: pnpm run verify:smoke:browser:basics:skip-build

      - name: Create deploy artifact
        id: package
        run: |
          RELEASE_ID="${{ inputs.environment_name }}-${GITHUB_SHA::12}"
          ARTIFACT_NAME="projex-${RELEASE_ID}.tar.gz"
          ARTIFACT_PATH="$(ARTIFACT_NAME="$ARTIFACT_NAME" pnpm run deploy:artifact:create | tail -n 1)"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "artifact_path=${ARTIFACT_PATH}" >> "$GITHUB_OUTPUT"

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error

  deploy-ec2:
    if: ${{ inputs.deploy_target == 'ec2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build-artifact
    environment: ${{ inputs.environment_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download deploy artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-artifact.outputs.artifact-name }}
          path: artifacts

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOST: ${{ secrets.EC2_SSH_KNOWN_HOST }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          if [ -n "$SSH_KNOWN_HOST" ]; then
            printf '%s\n' "$SSH_KNOWN_HOST" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload artifact to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          PORT="${EC2_PORT:-22}"
          scp -P "$PORT" "artifacts/${{ needs.build-artifact.outputs.artifact-name }}" \
            "${EC2_USER}@${EC2_HOST}:/tmp/${{ needs.build-artifact.outputs.artifact-name }}"

      - name: Deploy artifact on EC2
        env:
          EC2_APP_ROOT: ${{ secrets.EC2_APP_ROOT }}
          EC2_ENV_FILE: ${{ secrets.EC2_ENV_FILE }}
          EC2_HEALTH_URL: ${{ secrets.EC2_HEALTH_URL }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_READY_URL: ${{ secrets.EC2_READY_URL }}
          EC2_SERVICE_NAME: ${{ secrets.EC2_SERVICE_NAME }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEEP_RELEASES: ${{ secrets.EC2_KEEP_RELEASES }}
        run: |
          PORT="${EC2_PORT:-22}"
          APP_ROOT="${EC2_APP_ROOT:-/opt/projex}"
          ENV_FILE="${EC2_ENV_FILE:-/etc/projex/projex.env}"
          SERVICE_NAME="${EC2_SERVICE_NAME:-projex}"
          HEALTH_URL="${EC2_HEALTH_URL:-http://127.0.0.1:3000/api/health}"
          READY_URL="${EC2_READY_URL:-http://127.0.0.1:3000/api/ready}"
          KEEP_RELEASES="${EC2_KEEP_RELEASES:-5}"
          RELEASE_DIR="${APP_ROOT}/releases/${{ needs.build-artifact.outputs.release-id }}"
          ARTIFACT_PATH="/tmp/${{ needs.build-artifact.outputs.artifact-name }}"
          ssh -p "$PORT" "${EC2_USER}@${EC2_HOST}" "
            set -euo pipefail
            mkdir -p '${APP_ROOT}/releases' '${APP_ROOT}/shared'
            rm -rf '${RELEASE_DIR}'
            mkdir -p '${RELEASE_DIR}'
            tar -xzf '${ARTIFACT_PATH}' -C '${RELEASE_DIR}'
            rm -f '${ARTIFACT_PATH}'
            APP_ROOT='${APP_ROOT}' \
            RELEASE_DIR='${RELEASE_DIR}' \
            ENV_FILE='${ENV_FILE}' \
            SERVICE_NAME='${SERVICE_NAME}' \
            HEALTH_URL='${HEALTH_URL}' \
            READY_URL='${READY_URL}' \
            KEEP_RELEASES='${KEEP_RELEASES}' \
            '${RELEASE_DIR}/scripts/deploy-artifact-ec2.sh'
          "

      - name: Verify deployed public surface
        env:
          PROJEX_VERIFY_BASE_URL: ${{ secrets.EC2_PUBLIC_BASE_URL }}
          PROJEX_VERIFY_AUTH_EMAIL: ${{ secrets.EC2_VERIFY_AUTH_EMAIL }}
          PROJEX_VERIFY_AUTH_PASSWORD: ${{ secrets.EC2_VERIFY_AUTH_PASSWORD }}
        run: |
          test -n "$PROJEX_VERIFY_BASE_URL"
          node scripts/verify-deploy-security.mjs
