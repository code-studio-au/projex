name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and package
        required: true
        default: main
        type: string
      deploy_target:
        description: Build artifact only, or build and push to EC2
        required: true
        default: artifact-only
        type: choice
        options:
          - artifact-only
          - ec2
      environment_name:
        description: Protected deployment environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      aws_region:
        description: AWS region for artifact handoff and SSM deploy
        required: true
        default: ap-southeast-2
        type: string

concurrency:
  group: deploy-${{ inputs.environment_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: projex_deploy_gate
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d projex_deploy_gate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/projex_deploy_gate
      BETTER_AUTH_SECRET: projex-deploy-better-auth-secret-0123456789
      BETTER_AUTH_URL: https://projex.test.invalid
      BETTER_AUTH_TRUSTED_ORIGINS: https://projex.test.invalid
      PROJEX_ENABLE_DEV_ENDPOINTS: 'false'
      PROJEX_ENABLE_SMOKE_TOOLS: 'false'
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact_name }}
      artifact-sha256: ${{ steps.package.outputs.artifact_sha256 }}
      commit-sha: ${{ steps.source.outputs.commit_sha }}
      release-id: ${{ steps.package.outputs.release_id }}
      run-attempt: ${{ steps.package.outputs.run_attempt }}

    steps:
      - name: Validate protected deploy source
        if: ${{ inputs.deploy_target == 'ec2' }}
        env:
          DEPLOY_INPUT_REF: ${{ inputs.ref }}
          DEPLOY_WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ "$DEPLOY_INPUT_REF" != "main" || "$DEPLOY_WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "EC2 deploys must build main from a workflow dispatched on main." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve immutable source revision
        id: source
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved checkout is not a full lowercase Git SHA." >&2
            exit 1
          fi
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.0.8

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run application verification gate
        run: pnpm run verify:app

      - name: Run CDK verification gate
        run: pnpm run verify:cdk

      - name: Run database verification gate
        run: pnpm run verify:db:gate

      - name: Run full smoke verification gate
        run: pnpm run verify:smoke:full:skip-build

      - name: Run browser smoke verification gate
        run: pnpm run verify:smoke:browser:full:skip-build

      - name: Rebuild production deploy artifact payload
        env:
          NODE_ENV: production
          BETTER_AUTH_URL: https://projex.test.invalid
          BETTER_AUTH_TRUSTED_ORIGINS: https://projex.test.invalid
          PROJEX_APP_BASE_URL: https://projex.test.invalid
          PROJEX_AUTH_RESET_REDIRECT_URL: https://projex.test.invalid/reset-password
          PROJEX_AUTH_EMAIL_CHANGE_REDIRECT_URL: https://projex.test.invalid/verify-email-change
          PROJEX_ENABLE_DEV_ENDPOINTS: 'false'
          PROJEX_ENABLE_SMOKE_TOOLS: 'false'
        run: pnpm run build

      - name: Create deploy artifact
        id: package
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment_name }}
          SOURCE_GIT_SHA: ${{ steps.source.outputs.commit_sha }}
        run: |
          if [[ ! "$DEPLOY_ENVIRONMENT" =~ ^[a-z0-9][a-z0-9-]{0,31}$ ]]; then
            echo "Deployment environment has an invalid identifier." >&2
            exit 1
          fi
          if [[ ! "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ || ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "GitHub run identity is invalid." >&2
            exit 1
          fi
          RELEASE_ID="${DEPLOY_ENVIRONMENT}-${SOURCE_GIT_SHA:0:12}-run${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}"
          ARTIFACT_NAME="projex-${RELEASE_ID}.tar.gz"
          ARTIFACT_PATH="$(
            GIT_SHA="$SOURCE_GIT_SHA" \
            DEPLOY_ENVIRONMENT="$DEPLOY_ENVIRONMENT" \
            DEPLOY_RUN_ID="$GITHUB_RUN_ID" \
            DEPLOY_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            RELEASE_ID="$RELEASE_ID" \
            ARTIFACT_NAME="$ARTIFACT_NAME" \
            pnpm run deploy:artifact:create | tail -n 1
          )"
          read -r ARTIFACT_SHA256 _ < <(sha256sum "$ARTIFACT_PATH")
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=${ARTIFACT_SHA256}" >> "$GITHUB_OUTPUT"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "artifact_path=${ARTIFACT_PATH}" >> "$GITHUB_OUTPUT"

      - name: Upload deploy artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error

  deploy-ec2:
    if: ${{ inputs.deploy_target == 'ec2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build-artifact
    environment: ${{ inputs.environment_name }}
    env:
      DEPLOY_AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      DEPLOY_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      DEPLOY_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DEPLOY_AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      DEPLOY_EC2_APP_ROOT: ${{ secrets.EC2_APP_ROOT }}
      DEPLOY_EC2_DEPLOY_ARTIFACT_BUCKET: ${{ secrets.EC2_DEPLOY_ARTIFACT_BUCKET }}
      DEPLOY_EC2_ENV_FILE: ${{ secrets.EC2_ENV_FILE }}
      DEPLOY_EC2_HEALTH_URL: ${{ secrets.EC2_HEALTH_URL }}
      DEPLOY_EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      DEPLOY_EC2_KEEP_RELEASES: ${{ secrets.EC2_KEEP_RELEASES }}
      DEPLOY_EC2_PUBLIC_BASE_URL: ${{ secrets.EC2_PUBLIC_BASE_URL }}
      DEPLOY_EC2_READY_URL: ${{ secrets.EC2_READY_URL }}
      DEPLOY_EC2_SERVICE_NAME: ${{ secrets.EC2_SERVICE_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build-artifact.outputs.commit-sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Configure AWS credentials from OIDC
        if: ${{ env.DEPLOY_AWS_DEPLOY_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ env.DEPLOY_AWS_DEPLOY_ROLE_ARN }}

      - name: Configure AWS credentials from static secrets
        if: ${{ env.DEPLOY_AWS_DEPLOY_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ inputs.aws_region }}
          aws-access-key-id: ${{ env.DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.DEPLOY_AWS_SESSION_TOKEN }}

      - name: Download deploy artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build-artifact.outputs.artifact-name }}
          path: artifacts

      - name: Upload artifact to deploy bucket
        id: upload-artifact-s3
        env:
          AWS_REGION_DEPLOY: ${{ inputs.aws_region }}
          DEPLOY_ARTIFACT_BUCKET: ${{ env.DEPLOY_EC2_DEPLOY_ARTIFACT_BUCKET }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment_name }}
          EXPECTED_ARTIFACT_SHA256: ${{ needs.build-artifact.outputs.artifact-sha256 }}
          EXPECTED_GIT_SHA: ${{ needs.build-artifact.outputs.commit-sha }}
          RELEASE_ID: ${{ needs.build-artifact.outputs.release-id }}
        run: |
          test -n "$DEPLOY_ARTIFACT_BUCKET"
          ARTIFACT_NAME="${{ needs.build-artifact.outputs.artifact-name }}"
          read -r ACTUAL_ARTIFACT_SHA256 _ < <(sha256sum "artifacts/${ARTIFACT_NAME}")
          if [[ "$ACTUAL_ARTIFACT_SHA256" != "$EXPECTED_ARTIFACT_SHA256" ]]; then
            echo "Downloaded GitHub artifact checksum does not match the build output." >&2
            exit 1
          fi
          S3_KEY="deploy-artifacts/${DEPLOY_ENVIRONMENT}/${EXPECTED_GIT_SHA}/${RELEASE_ID}/${ARTIFACT_NAME}"
          aws s3 cp \
            --region "$AWS_REGION_DEPLOY" \
            "artifacts/${ARTIFACT_NAME}" \
            "s3://${DEPLOY_ARTIFACT_BUCKET}/${S3_KEY}"
          echo "artifact_s3_uri=s3://${DEPLOY_ARTIFACT_BUCKET}/${S3_KEY}" >> "$GITHUB_OUTPUT"

      - name: Dispatch deploy command over SSM
        id: dispatch-ssm
        env:
          ARTIFACT_AWS_REGION: ${{ inputs.aws_region }}
          ARTIFACT_SHA256: ${{ needs.build-artifact.outputs.artifact-sha256 }}
          ARTIFACT_S3_URI: ${{ steps.upload-artifact-s3.outputs.artifact_s3_uri }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment_name }}
          DEPLOY_RUN_ATTEMPT: ${{ needs.build-artifact.outputs.run-attempt }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          EC2_APP_ROOT: ${{ env.DEPLOY_EC2_APP_ROOT }}
          EC2_ENV_FILE: ${{ env.DEPLOY_EC2_ENV_FILE }}
          EC2_HEALTH_URL: ${{ env.DEPLOY_EC2_HEALTH_URL }}
          EC2_INSTANCE_ID: ${{ env.DEPLOY_EC2_INSTANCE_ID }}
          EC2_READY_URL: ${{ env.DEPLOY_EC2_READY_URL }}
          EC2_SERVICE_NAME: ${{ env.DEPLOY_EC2_SERVICE_NAME }}
          EC2_KEEP_RELEASES: ${{ env.DEPLOY_EC2_KEEP_RELEASES }}
          EXPECTED_GIT_SHA: ${{ needs.build-artifact.outputs.commit-sha }}
          RELEASE_ID: ${{ needs.build-artifact.outputs.release-id }}
        run: |
          test -n "$EC2_INSTANCE_ID"
          test -n "$ARTIFACT_S3_URI"
          APP_ROOT="${EC2_APP_ROOT:-/opt/projex}"
          ENV_FILE="${EC2_ENV_FILE:-/etc/projex/projex.env}"
          SERVICE_NAME="${EC2_SERVICE_NAME:-projex}"
          HEALTH_URL="${EC2_HEALTH_URL:-http://127.0.0.1:3000/api/health}"
          READY_URL="${EC2_READY_URL:-http://127.0.0.1:3000/api/ready}"
          KEEP_RELEASES="${EC2_KEEP_RELEASES:-5}"
          SCRIPT_B64="$(base64 -w 0 scripts/deploy-artifact-ssm.sh)"
          export APP_ROOT ENV_FILE SERVICE_NAME HEALTH_URL READY_URL KEEP_RELEASES SCRIPT_B64
          python3 - <<'PY' > /tmp/projex-ssm-commands.json
          import json
          import os
          import shlex

          env_values = {
              "APP_ROOT": os.environ["APP_ROOT"],
              "RELEASE_ID": os.environ["RELEASE_ID"],
              "EXPECTED_GIT_SHA": os.environ["EXPECTED_GIT_SHA"],
              "DEPLOY_ENVIRONMENT": os.environ["DEPLOY_ENVIRONMENT"],
              "DEPLOY_RUN_ID": os.environ["DEPLOY_RUN_ID"],
              "DEPLOY_RUN_ATTEMPT": os.environ["DEPLOY_RUN_ATTEMPT"],
              "ENV_FILE": os.environ["ENV_FILE"],
              "SERVICE_NAME": os.environ["SERVICE_NAME"],
              "HEALTH_URL": os.environ["HEALTH_URL"],
              "READY_URL": os.environ["READY_URL"],
              "KEEP_RELEASES": os.environ["KEEP_RELEASES"],
              "ARTIFACT_S3_URI": os.environ["ARTIFACT_S3_URI"],
              "ARTIFACT_AWS_REGION": os.environ["ARTIFACT_AWS_REGION"],
              "ARTIFACT_SHA256": os.environ["ARTIFACT_SHA256"],
          }
          env_prefix = " ".join(
              f"{key}={shlex.quote(value)}" for key, value in env_values.items()
          )
          commands = [
              "set -euo pipefail",
              "cat <<'PROJEX_SSM_SCRIPT_B64' >/tmp/projex-deploy-artifact-ssm.sh.b64",
              os.environ["SCRIPT_B64"],
              "PROJEX_SSM_SCRIPT_B64",
              "base64 -d /tmp/projex-deploy-artifact-ssm.sh.b64 >/tmp/projex-deploy-artifact-ssm.sh",
              "chmod 0755 /tmp/projex-deploy-artifact-ssm.sh",
              f"{env_prefix} bash /tmp/projex-deploy-artifact-ssm.sh",
          ]
          print(json.dumps({"commands": commands}))
          PY
          COMMAND_ID="$(
            aws ssm send-command \
              --region "${{ inputs.aws_region }}" \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Projex deploy ${RELEASE_ID}" \
              --parameters file:///tmp/projex-ssm-commands.json \
              --query 'Command.CommandId' \
              --output text
          )"
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM deploy completion
        env:
          AWS_REGION_DEPLOY: ${{ inputs.aws_region }}
          COMMAND_ID: ${{ steps.dispatch-ssm.outputs.command_id }}
          EC2_INSTANCE_ID: ${{ env.DEPLOY_EC2_INSTANCE_ID }}
        run: |
          test -n "$COMMAND_ID"
          test -n "$EC2_INSTANCE_ID"
          while true; do
            STATUS="$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION_DEPLOY" \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query 'Status' \
                --output text 2>/dev/null || true
            )"
            case "$STATUS" in
              ""|Pending|InProgress|Delayed)
                sleep 10
                ;;
              Success)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION_DEPLOY" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                break
                ;;
              *)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION_DEPLOY" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text || true
                aws ssm get-command-invocation \
                  --region "$AWS_REGION_DEPLOY" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text || true
                echo "SSM deploy failed with status: $STATUS" >&2
                exit 1
                ;;
            esac
          done

      - name: Verify deployed public surface
        env:
          PROJEX_VERIFY_BASE_URL: ${{ secrets.EC2_PUBLIC_BASE_URL }}
          PROJEX_VERIFY_AUTH_EMAIL: ${{ secrets.EC2_VERIFY_AUTH_EMAIL }}
          PROJEX_VERIFY_AUTH_PASSWORD: ${{ secrets.EC2_VERIFY_AUTH_PASSWORD }}
        run: |
          test -n "$PROJEX_VERIFY_BASE_URL"
          node scripts/verify-deploy-security.mjs
