name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm run build

  verify-db:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: projex_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d projex_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/projex_ci
      BETTER_AUTH_SECRET: projex-ci-better-auth-secret-0123456789
      BETTER_AUTH_URL: https://projex.test.invalid
      BETTER_AUTH_TRUSTED_ORIGINS: https://projex.test.invalid

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to CI database
        run: pnpm run db:migrate

      - name: Verify generated DB types
        run: pnpm run db:verify-types

      - name: Run disposable DB integration tests
        run: pnpm run test:integration:db

  smoke-disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/projex_ci
      BETTER_AUTH_SECRET: projex-ci-better-auth-secret-0123456789
      BETTER_AUTH_URL: https://projex.test.invalid
      BETTER_AUTH_TRUSTED_ORIGINS: https://projex.test.invalid
      NODE_ENV: test
      PROJEX_ENABLE_DEV_ENDPOINTS: 'false'
      PROJEX_ENABLE_SMOKE_TOOLS: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run disposable smoke basics
        run: pnpm run smoke:server:disposable -- --section=basics
