services:
  postgres:
    image: postgres:16-alpine
    container_name: projex-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: projex
      POSTGRES_USER: projex
      POSTGRES_PASSWORD: projex
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U projex -d projex']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./.local/postgres/data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: projex_miniO
    restart: unless-stopped
    ports:
      - '9010:9000'
      - '9011:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ./.local/minio/data:/data
