packages:
  - deploy/cdk

overrides:
  'brace-expansion@<5.0.8': 5.0.8
  'js-yaml@>=4.0.0 <4.3.0': 4.3.0
  'postcss@<8.5.18': 8.5.18

# Delay dependency resolution for newly published packages to reduce
# exposure to fresh supply-chain compromises and registry hijacks.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@types/*'
  - 'brace-expansion@5.0.8'

# Refuse weaker trust evidence than previous releases and block exotic
# dependency specs unless we opt into them deliberately.
trustPolicy: no-downgrade
blockExoticSubdeps: true
allowBuilds:
  esbuild: true
patchedDependencies:
  brace-expansion@5.0.8: patches/brace-expansion@5.0.8.patch
