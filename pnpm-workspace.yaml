packages:
  - deploy/cdk

overrides:
  '@babel/core@7.29.7>semver': 7.8.5
  '@babel/helper-compilation-targets@7.29.7>semver': 7.8.5
  'brace-expansion@<5.0.9': 5.0.9
  'fast-uri@>=3.0.0 <3.1.5': 3.1.5
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  'nanoid@<3.3.18': 3.3.18
  'undici@>=7.0.0 <7.29.0': 7.29.0

# Delay dependency resolution for newly published packages to reduce
# exposure to fresh supply-chain compromises and registry hijacks.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@types/*'

# Refuse weaker trust evidence than previous releases and block exotic
# dependency specs unless we opt into them deliberately.
trustPolicy: no-downgrade
blockExoticSubdeps: true
allowBuilds:
  esbuild: true
patchedDependencies:
  brace-expansion@5.0.9: patches/brace-expansion@5.0.9.patch
